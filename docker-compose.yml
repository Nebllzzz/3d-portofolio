# Port map (default, override via .env):
#   FRONTEND_PORT (6010) -> frontend  (Vue 3 + Vite dev server)
#   BACKEND_PORT  (6011) -> nginx -> php-fpm (API Laravel + Filament /admin)
#   DB_PORT_HOST  (6012) -> db (MySQL 8.4)
#   PMA_PORT      (6013) -> phpmyadmin
#
# Antar container saling panggil pakai nama service
# (mis. DB_HOST=db, fastcgi_pass backend:9000).

name: ${COMPOSE_NAME:-portofolio}

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:6011}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:6010}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-portfolio_nandi}
  DB_USERNAME: ${DB_USERNAME:-nandi}
  DB_PASSWORD: ${DB_PASSWORD:-nandi}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-portfolio_nandi}
      MYSQL_USER: ${DB_USERNAME:-nandi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nandi}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT_HOST:-6012}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - portfolio-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-6011}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - portfolio-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:6011}
    ports:
      - "${FRONTEND_PORT:-6010}:${VITE_PORT:-7010}"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - nginx
    networks:
      - portfolio-net

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-6013}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio-net

networks:
  portfolio-net:
    driver: bridge

volumes:
  db-data:
  frontend-node-modules:
