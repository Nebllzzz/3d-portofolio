  # backend:
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile
  #     args:
  #       UID: ${UID:-1000}
  #       GID: ${GID:-1000}
  #   container_name: husennnnnn-backend
  #   restart: unless-stopped
  #   environment: *app-env
  #   volumes:
  #     - ./backend:/var/www/html
  #   depends_on:
  #     db:
  #       condition: service_healthy

  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: husennnnnn-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "7011:80"
  #   volumes:
  #     - ./backend:/var/www/html:ro
  #     - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: husennnnnn-frontend
    restart: unless-stopped
    ports:
      - "7010:7010"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
volumes:
  db-data:
  frontend-node-modules:
