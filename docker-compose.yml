# Port map:
#   7010 -> frontend  (Vue 3 + Vite dev server)
#   7011 -> backend   (nginx -> php-fpm; API Laravel + panel Filament /admin)
#
# Semua service dihubungkan lewat network `portfolio-net`. Database tidak
# dipublikasikan ke host dan hanya bisa diakses container di network ini
# memakai nama service `db` (mis. DB_HOST=db).

name: portofolio

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:7011}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:7010}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-portfolio_nandi}
  DB_USERNAME: ${DB_USERNAME:-nandi}
  DB_PASSWORD: ${DB_PASSWORD:-nandi}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-nandizailani@gmail.com}
  # Default ini hanya untuk development lokal. Ganti sebelum deploy.
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-before-production}

services:
  db:
    image: mysql:8.4
    container_name: portofolio-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-portfolio_nandi}
      MYSQL_USER: ${DB_USERNAME:-nandi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nandi}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - portfolio-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portofolio-backend
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio-net

  nginx:
    image: nginx:1.27-alpine
    container_name: portofolio-nginx
    restart: unless-stopped
    ports:
      - "7011:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - portfolio-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portofolio-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:7011}
    ports:
      - "7010:7010"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - nginx
    networks:
      - portfolio-net

networks:
  portfolio-net:
    name: portofolio-net
    driver: bridge

volumes:
  db-data:
  frontend-node-modules:
