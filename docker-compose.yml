# Port map:
#   7010 -> frontend  (Vue 3 + Vite dev server)
#   7011 -> backend   (nginx -> php-fpm; API Laravel + panel Filament /admin)
#
# Database tidak dipublikasikan ke host saat backend stack diaktifkan.

name: husennnnnn

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:7011}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:7010}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-portfolio_nandi}
  DB_USERNAME: ${DB_USERNAME:-nandi}
  DB_PASSWORD: ${DB_PASSWORD:-nandi}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-nandizailani@gmail.com}
  # Default ini hanya untuk development lokal. Ganti sebelum deploy.
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-before-production}

services:
  # Backend stack is intentionally disabled while this portfolio is frontend-only.
  # Re-enable the blocks below if the Laravel API, admin panel, or MySQL database is needed.
